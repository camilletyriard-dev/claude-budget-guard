[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-budget-guard"
version = "0.1.0"
description = "Per-project and per-API-key budgets for the Claude API: cost estimates, confirmation prompts, hard stops, and a key watchdog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
claude-budget = "claude_budget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
