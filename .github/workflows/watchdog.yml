# Runs the watchdog every 15 minutes on GitHub's servers: no lab server needed.
# Setup (repo admin): Settings > Secrets and variables > Actions
#   secret   ANTHROPIC_ADMIN_KEY   Admin API key from the Broad admins (sk-ant-admin01-...)
#   secret   SLACK_WEBHOOK_URL     incoming webhook for the lab channel (optional)
#   variable WATCHDOG_ENFORCE      "true" to actually disable keys; anything else = dry run
# GitHub may delay scheduled runs by several minutes; treat this as a backstop, not a hard limit.
name: watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency: watchdog

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ vars.WATCHDOG_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # alert de-duplication state survives between runs via the cache
      - uses: actions/cache/restore@v4
        with:
          path: watchdog_state.json
          key: watchdog-state-${{ github.run_id }}
          restore-keys: watchdog-state-
      - run: pip install --no-deps .
      - run: claude-budget watchdog --caps caps.toml ${{ vars.WATCHDOG_ENFORCE == 'true' && '--enforce' || '' }}
        env:
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: watchdog_state.json
          key: watchdog-state-${{ github.run_id }}
